name: Atualizar IAlfabeto

# Robô do ialfabeto.com.br. O código do site fica num repositório privado; este repositório público só dispara a rodada
# (repositório público = minutos de GitHub Actions grátis e sem limite).
on:
  schedule:
    - cron: "17 * * * *"   # de hora em hora
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      destino:
        description: "Onde publicar: main (site oficial) ou preview (prévia)"
        default: "main"
        type: choice
        options: [main, preview]

permissions:
  contents: read
  actions: write  # pra se reagendar (o cron do GitHub atrasa/pula muito)
  models: read   # GitHub Models grátis (IA reserva)

jobs:
  atualizar:
    # só a rodada de verdade entra na fila (a espera da "proxima" não trava uma publicação nova)
    concurrency:
      group: atualizar
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SchefferRodolfo/ialfabeto
          ref: main
          token: ${{ secrets.IALFABETO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodada completa
        env:
          DESTINO: ${{ inputs.destino || 'main' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: bash scripts/rodar.sh

  # O agendador do GitHub pula muitas execuções. Cada rodada agenda a próxima pra ~1h depois do início
  # (o cron acima fica só de reserva, caso a corrente quebre).
  proxima:
    needs: atualizar
    # só existe 1 espera viva: uma rodada nova (push, cron ou disparo) cancela a espera antiga e vira a corrente
    concurrency:
      group: proxima
      cancel-in-progress: true
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Esperar e disparar a próxima rodada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INICIO: ${{ github.event.repository.updated_at }}
        run: |
          INI=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} -q .run_started_at)
          ESPERA=$(( 3600 - ( $(date +%s) - $(date -d "$INI" +%s) ) ))
          [ $ESPERA -gt 0 ] && sleep $ESPERA
          gh workflow run atualizar.yml -R ${{ github.repository }} --ref main && echo "próxima rodada disparada"
