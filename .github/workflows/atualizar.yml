name: Atualizar IAlfabeto

# Robô do ialfabeto.com.br. O código do site fica num repositório privado; este repositório público só dispara a rodada
# (repositório público = minutos de GitHub Actions grátis e sem limite).
on:
  schedule:
    - cron: "17 * * * *"   # de hora em hora
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      destino:
        description: "Onde publicar: main (site oficial) ou preview (prévia)"
        default: "main"
        type: choice
        options: [main, preview]

permissions:
  contents: read
  models: read   # GitHub Models grátis (IA reserva)

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SchefferRodolfo/ialfabeto
          ref: main
          token: ${{ secrets.IALFABETO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodada completa
        env:
          DESTINO: ${{ inputs.destino || 'main' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: bash scripts/rodar.sh
